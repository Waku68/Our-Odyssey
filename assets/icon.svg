<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
<title>Our Odyssey</title>
<defs>
<path id="w" d="M80,120 C110,120 110,280 140,280 S170,120 200,120 S230,280 260,280 S290,120 320,120"/>
<path id="m" d="M80,280 C110,280 110,120 140,120 S170,280 200,280 S230,120 260,120 S290,280 320,280"/>
<clipPath id="strips-m-over"><rect x="80" y="0" width="60" height="400"/><rect x="200" y="0" width="60" height="400"/></clipPath>
<clipPath id="strips-w-over"><rect x="140" y="0" width="60" height="400"/><rect x="260" y="0" width="60" height="400"/></clipPath>
<mask id="under-w" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
<rect width="400" height="400" fill="#fff"/>
<g clip-path="url(#strips-m-over)"><use href="#m" fill="none" stroke="#000" stroke-width="54" stroke-linecap="round"/></g>
</mask>
<mask id="under-m" maskUnits="userSpaceOnUse" x="0" y="0" width="400" height="400">
<rect width="400" height="400" fill="#fff"/>
<g clip-path="url(#strips-w-over)"><use href="#w" fill="none" stroke="#000" stroke-width="54" stroke-linecap="round"/></g>
</mask>
</defs>
<rect width="400" height="400" fill="#DCE3EC"/>
<g transform="translate(-30,-30) scale(1.15)" fill="none" stroke-width="36" stroke-linecap="round" stroke-linejoin="round">
<use href="#m" stroke="#E46F8E" mask="url(#under-m)"/>
<use href="#w" stroke="#1C2B7A" mask="url(#under-w)"/>
</g>
</svg>
