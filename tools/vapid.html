<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>通知の鍵を作る</title>
<style>
body { font-family: sans-serif; background: #F2C4CE; color: #16204F; padding: 24px; max-width: 560px; margin: 0 auto; line-height: 1.7; }
textarea { width: 100%; height: 72px; font-size: 14px; }
button { min-height: 44px; padding: 0 18px; font-size: 15px; }
</style>
</head>
<body>
<h1>通知の鍵を作る</h1>
<p>ボタンを押すと、この端末の中だけで鍵が2つ作られます（どこにも送信されません）。作るのは一度だけで大丈夫です。</p>
<button id="go">鍵を作る</button>
<p><b>公開鍵</b>（js/config.js の VAPID_PUBLIC_KEY と、Supabase の VAPID_PUBLIC_KEY に入れる）</p>
<textarea id="pub" readonly></textarea>
<p><b>秘密鍵</b>（Supabase の Secrets の VAPID_PRIVATE_KEY にだけ入れる。人に見せない・GitHubに置かない）</p>
<textarea id="priv" readonly></textarea>
<script>
const b64u = (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
document.getElementById('go').onclick = async () => {
  const k = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
  document.getElementById('pub').value = b64u(await crypto.subtle.exportKey('raw', k.publicKey));
  document.getElementById('priv').value = (await crypto.subtle.exportKey('jwk', k.privateKey)).d;
};
</script>
</body>
</html>
