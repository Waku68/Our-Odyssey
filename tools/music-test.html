<!doctype html><meta charset="utf-8"><title>music test</title>
<pre id="o">running…</pre>
<script>
const o = document.getElementById('o'); const log = (s) => { o.textContent += '\n' + s; };
function jsonp(url, cbParam = 'callback') {
  return new Promise((ok, ng) => {
    const cb = 'cb' + Math.random().toString(36).slice(2);
    const s = document.createElement('script');
    const t = setTimeout(() => ng(new Error('timeout')), 10000);
    window[cb] = (d) => { clearTimeout(t); ok(d); };
    s.onerror = () => { clearTimeout(t); ng(new Error('script error')); };
    s.src = url + '&' + cbParam + '=' + cb; document.head.append(s);
  });
}
const q = 'wonderwall';
const tests = [
  ['itunes jsonp', () => jsonp(`https://itunes.apple.com/search?term=${q}&country=jp&lang=ja_jp&media=music&entity=song&limit=3`).then((j) => j.results.map((r) => r.trackName + ' / ' + r.artistName + ' / ' + !!r.previewUrl))],
  ['itunes fetch', () => fetch(`https://itunes.apple.com/search?term=${q}&country=jp&media=music&entity=song&limit=3`).then((r) => r.json()).then((j) => j.results.map((r) => r.trackName + ' / ' + !!r.previewUrl))],
  ['deezer jsonp', () => jsonp(`https://api.deezer.com/search?q=${q}&output=jsonp&limit=3`).then((j) => j.data.map((r) => r.title + ' / ' + r.artist.name + ' / ' + !!r.preview))],
];
(async () => { for (const [n, f] of tests) { try { log(n + ': OK ' + JSON.stringify(await f())); } catch (e) { log(n + ': NG ' + e.message); } } log('done'); })();
</script>
